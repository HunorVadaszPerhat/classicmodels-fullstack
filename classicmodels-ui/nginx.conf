# =============================================================================
# nginx config — single server block for the SPA + reverse proxy to backend.
# =============================================================================
# This file is dropped into /etc/nginx/conf.d/ inside the container.
# The base nginx image already provides nginx.conf with the standard
# events {} and http {} wrappers; we only need to define a server {}.
# =============================================================================

server {
    listen       80;
    server_name  _;

    # --- SPA static assets ---------------------------------------------------
    #
    # Angular's HTML5 routing means URLs like /employees/123 are handled
    # client-side: only / serves real HTML, everything else resolves
    # through the SPA's router. So if the user reloads on /employees/123
    # nginx must serve index.html (the SPA), not 404.
    #
    # try_files attempts each candidate in order:
    #   $uri          → exact-match a static file (eg. /favicon.ico)
    #   $uri/         → match a directory with an index file
    #   /index.html   → fallback for everything else (SPA bootstrap)
    #
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;

        # SPA bundles are content-hashed by ng build, so they can be
        # cached very aggressively. index.html itself must NOT be cached
        # (or users won't pick up new builds).
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # --- Backend API proxy ---------------------------------------------------
    #
    # Forward /api/* to the backend service, which the Docker Compose
    # network exposes as the hostname "backend" on port 9090. The
    # backend's context-path is /api/v1, so requests to
    # /api/v1/employees here land on /api/v1/employees there.
    #
    # The Vite dev proxy did the same thing in development; this is the
    # production equivalent.
    #
    location /api/ {
        proxy_pass         http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;

        # WebSocket upgrade headers — needed for STOMP over /api/v1/ws.
        # nginx by default doesn't forward Upgrade/Connection, so we
        # set them explicitly. Without these, the STOMP handshake from
        # Feature 10 fails inside the compose stack.
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        # Buffering off for SSE / streaming responses; default is on
        # which would batch chunks and break long-lived connections.
        proxy_buffering    off;
    }

    # --- Health check endpoint -----------------------------------------------
    #
    # nginx itself answers this — it's for load balancer / orchestrator
    # health probes that just want to know "is the SPA container up?"
    # If you also want to probe backend health you'd hit /api/v1/actuator/health.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
