<h2>Orders</h2>
<button mat-raised-button color="primary" routerLink="new">New Order</button>
<table mat-table [dataSource]="orders()" matSort>
  <ng-container matColumnDef="orderNumber">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>#</th>
    <td mat-cell *matCellDef="let o">{{o.orderNumber}}</td>
  </ng-container>
  <ng-container matColumnDef="orderDate">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Date</th>
    <td mat-cell *matCellDef="let o">{{o.orderDate}}</td>
  </ng-container>
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let o">{{o.status}}</td>
  </ng-container>
  <ng-container matColumnDef="customerNumber">
    <th mat-header-cell *matHeaderCellDef>Customer</th>
    <td mat-cell *matCellDef="let o">{{o.customerNumber}}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let o">
      <a mat-button [routerLink]="o.orderNumber">View</a>
      <a mat-button [routerLink]="o.orderNumber + '/edit'">Edit</a>
      <button mat-button color="warn" (click)="remove(o.orderNumber!)">Delete</button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [length]="total()" [pageSize]="10" (page)="load($event)"></mat-paginator>
@if (loading()) {
  <div>Loading...</div>
}
@if (error()) {
  <div>Error: {{ error() }}</div>
}
