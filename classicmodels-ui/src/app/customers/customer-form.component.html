<h2>{{isEdit ? 'Edit' : 'New'}} Customer</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-form-field>
    <mat-label>Customer Number</mat-label>
    <input matInput type="number" formControlName="customerNumber" required [readonly]="isEdit" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Customer Name</mat-label>
    <input matInput formControlName="customerName" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>ContactComponent Last Name</mat-label>
    <input matInput formControlName="contactLastName" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>ContactComponent First Name</mat-label>
    <input matInput formControlName="contactFirstName" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Phone</mat-label>
    <input matInput formControlName="phone" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Address Line 1</mat-label>
    <input matInput formControlName="addressLine1" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Address Line 2</mat-label>
    <input matInput formControlName="addressLine2" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>City</mat-label>
    <input matInput formControlName="city" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>State</mat-label>
    <input matInput formControlName="state" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Postal Code</mat-label>
    <input matInput formControlName="postalCode" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Country</mat-label>
    <input matInput formControlName="country" required />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Sales Rep Employee Number</mat-label>
    <input matInput type="number" formControlName="salesRepEmployeeNumber" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Credit Limit</mat-label>
    <input matInput type="number" formControlName="creditLimit" />
  </mat-form-field>
  <button mat-raised-button color="primary" type="submit" >Save</button>
  <a mat-button [routerLink]="isEdit ? '../../' : '../'">Cancel</a>
</form>
