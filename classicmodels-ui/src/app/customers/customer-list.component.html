<h2>Customers</h2>
<button mat-raised-button color="primary" routerLink="new">New Customer</button>
<table mat-table [dataSource]="customers()" matSort>
  <ng-container matColumnDef="customerName">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
    <td mat-cell *matCellDef="let c">{{c.customerName}}</td>
  </ng-container>
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Phone</th>
    <td mat-cell *matCellDef="let c">{{c.phone}}</td>
  </ng-container>
  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>City</th>
    <td mat-cell *matCellDef="let c">{{c.city}}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let c">
      <a mat-button [routerLink]="c.customerNumber">View</a>
      <a mat-button [routerLink]="c.customerNumber + '/edit'">Edit</a>
      <button mat-button color="warn" (click)="remove(c.customerNumber)">Delete</button>
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator
  [length]="total()"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[5, 10, 25, 50]"
  (page)="onPageChange($event)">
</mat-paginator>
@if (loading()) {
  <div>Loading...</div>
}
@if (error()) {
  <div>Error: {{ error() }}</div>
}
